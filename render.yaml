# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates the web service with the right build/start commands and declares
# every environment variable the app reads. Values marked `sync: false` are
# NOT stored here: Render prompts for them on first apply and keeps them in
# the dashboard, so no secret ever lands in this repo.

services:
  - type: web
    name: wedding-website
    runtime: node
    plan: starter          # free instances sleep after ~15m idle; guests would hit cold starts
    region: ohio
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true

    envVars:
      # Node version also comes from .nvmrc; pinned here so the two agree.
      - key: NODE_VERSION
        value: "20"

      # Public site origin, used to build absolute links in outgoing email.
      # Set this to the final custom domain once DNS is pointed at Render.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # ── Notion (registry, RSVP, seating, hotel blocks) ────────────────────
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: NOTION_REGISTRY_DATABASE_ID
        sync: false
      - key: NOTION_SEATING_DATABASE_ID
        sync: false

      # ── Email ─────────────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: REGISTRY_FROM_EMAIL
        sync: false

      # ── Secrets: registry claim encryption + RSVP edit-link signing ───────
      # Changing REGISTRY_CLAIM_KEY invalidates every RSVP edit link already
      # emailed and makes existing encrypted claim records unreadable.
      - key: REGISTRY_CLAIM_KEY
        sync: false
      - key: SEATING_PASSWORD
        sync: false
      # Guards the private /admin/analytics dashboard.
      - key: ADMIN_PASSWORD
        sync: false

      # ── Private page-view counts ─────────────────────────────────────────
      - key: NOTION_ANALYTICS_DATABASE_ID
        sync: false

      # ── Cash gift details shown to guests ─────────────────────────────────
      - key: VENMO_HANDLE
        sync: false
      - key: ZELLE_EMAIL
        sync: false
      - key: PAYPAL_EMAIL
        sync: false

      # ── Invite gate ───────────────────────────────────────────────────────
      # The ONE shared password for the whole site. The link to text guests does
      # NOT contain the password. To get it, sign in on the site with the
      # password, open "Open on another device" from the menu, and copy the link.
      # The link changes whenever SITE_PASSWORD or INVITE_SECRET changes.
      # Changing the password signs every device out and breaks the old link: it
      # is the only way to revoke access.
      - key: SITE_PASSWORD
        sync: false
      # Signs the device cookie. Changing it also signs every device out.
      # The gate only works when BOTH SITE_PASSWORD and INVITE_SECRET are set.
      - key: INVITE_SECRET
        sync: false
      # "on" enforces the gate; anything else leaves the site open. With
      # INVITE_GATE=on and SITE_PASSWORD or INVITE_SECRET unset, EVERYONE is
      # locked out: set both first, then test your own link before turning it on.
      - key: INVITE_GATE
        sync: false
